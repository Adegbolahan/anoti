name: CI

on:
  push:
    branches: [main]
  pull_request:

# The release job needs to push a tag.
permissions:
  contents: write

jobs:
  # The gate suite. This is the job that makes the plugin's central claim
  # checkable: that the commit gate actually blocks.
  hooks:
    name: Hook tests (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and jq
        run: sudo apt-get update && sudo apt-get install -y bats jq
      - name: Run hook suite
        run: bats --recursive --print-output-on-failure test/

  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        shell: bash
        run: |
          # Every tracked shell script, plus the bats helpers and the hook
          # scripts. -x follows `source-path=SCRIPTDIR` into _common.sh.
          mapfile -t files < <(git ls-files '*.sh' '*.bash' 'test/fixtures/bin/_record')
          if [ ${#files[@]} -eq 0 ]; then echo "no shell scripts found"; exit 0; fi
          printf 'linting %d file(s)\n' "${#files[@]}"
          shellcheck -x "${files[@]}"

  hook-schema:
    name: Hook schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Both manifests are valid JSON
        run: |
          jq empty project-scaffolder/hooks/hooks.json
          jq empty project-scaffolder/resources/templates/.claude/settings.json
      - name: settings.json registers NO hooks
        run: |
          # Since v3.0.0 hooks ship in the plugin. A hooks block left in the
          # scaffolded settings.json would shadow the plugin's and reintroduce
          # exactly the drift Approach C removed.
          if jq -e '.hooks' project-scaffolder/resources/templates/.claude/settings.json >/dev/null 2>&1; then
            echo "settings.json still registers hooks. They belong in hooks/hooks.json."
            exit 1
          fi
      - name: Hook commands are single-line
        run: |
          # test/helpers/setup.bash reads one command per line. If a hook body
          # ever gains a newline, the harness would silently mis-parse it.
          bad=$(jq -r '.hooks[][]?.hooks[]?.command | select(test("\n"))' \
                  project-scaffolder/hooks/hooks.json)
          if [ -n "$bad" ]; then
            echo "Multi-line hook command found. The bats harness parses one per line."
            echo "$bad"
            exit 1
          fi
      - name: Every hook declares a timeout
        run: |
          missing=$(jq -r '.hooks[][]?.hooks[]? | select(has("timeout") | not) | .command' \
                      project-scaffolder/hooks/hooks.json)
          if [ -n "$missing" ]; then
            echo "Hook without an explicit timeout:"; echo "$missing"; exit 1
          fi
      - name: Every registered hook script exists
        run: |
          fail=0
          for s in $(jq -r '.hooks[][]?.hooks[]?.command' project-scaffolder/hooks/hooks.json \
                     | grep -oE '\$\{CLAUDE_PLUGIN_ROOT\}/[^ ]+'); do
            path="project-scaffolder/${s#\$\{CLAUDE_PLUGIN_ROOT\}/}"
            [ -f "$path" ] || { echo "hooks.json points at a missing script: $path"; fail=1; }
          done
          exit $fail

  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: All version locations agree
        run: |
          plugin=$(jq -r '.version' project-scaffolder/.claude-plugin/plugin.json)
          market=$(jq -r '.plugins[] | select(.name=="project-scaffolder") | .version' \
                     .claude-plugin/marketplace.json)
          scaffold=$(jq -r '.scaffoldVersion' \
                     project-scaffolder/resources/templates/.claude/settings.json)
          echo "plugin.json      : $plugin"
          echo "marketplace.json : $market"
          echo "settings.json    : $scaffold"
          fail=0
          [ "$plugin" = "$market" ]   || { echo "FAIL: marketplace.json disagrees with plugin.json"; fail=1; }
          [ "$plugin" = "$scaffold" ] || { echo "FAIL: settings.json scaffoldVersion disagrees"; fail=1; }
          grep -q "^## \[$plugin\]" CHANGELOG.md || { echo "FAIL: CHANGELOG.md has no [$plugin] entry"; fail=1; }
          exit $fail
      - name: CHANGELOG entry is not empty
        run: |
          V=$(jq -r '.version' project-scaffolder/.claude-plugin/plugin.json)
          # A heading with no body is worse than no heading — it looks like the
          # release was documented when it was not.
          body=$(awk -v tag="## [$V]" \
                   'index($0,tag)==1 {p=1; next} p && /^## \[/ {exit} p {print}' \
                   CHANGELOG.md | tr -d '[:space:]')
          if [ -z "$body" ]; then
            echo "CHANGELOG.md has a [$V] heading but no content under it"
            exit 1
          fi
      - name: Advertised commands exist
        run: |
          # marketplace.json description is the storefront copy. If it names a
          # command, that command must ship.
          desc=$(jq -r '.plugins[] | select(.name=="project-scaffolder") | .description' \
                   .claude-plugin/marketplace.json)
          fail=0
          for c in $(printf '%s' "$desc" | grep -oE '/[a-z-]+' | sort -u); do
            name="${c#/}"
            if [ ! -f "project-scaffolder/commands/${name}.md" ]; then
              echo "FAIL: marketplace.json advertises $c but commands/${name}.md does not exist"
              fail=1
            fi
          done
          exit $fail

  # Tag a release only when every gate above is green and the version is new.
  #
  # Marketplace installs resolve from git, so the tag IS the release: it is the
  # only thing a user can pin to or roll back to. v2.2.0 and v2.3.0 shipped
  # without one, which is what this job exists to stop happening again.
  release:
    name: Tag release
    needs: [hooks, lint, hook-schema, versions]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Tag if this version is not yet released
        run: |
          V=$(jq -r '.version' project-scaffolder/.claude-plugin/plugin.json)
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "v$V is already tagged. Bump the version to cut a new release."
            exit 0
          fi
          # The tag message is this version's CHANGELOG section, so `git show
          # v2.3.0` tells you what shipped without leaving the terminal.
          awk -v tag="## [$V]" \
            'index($0,tag)==1 {p=1; next} p && /^## \[/ {exit} p {print}' \
            CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG section found for $V"
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -F /tmp/release-notes.md
          git push origin "v$V"
          echo "Tagged v$V"
