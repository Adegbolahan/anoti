  - id: D001
    date: 2026-08-12
    type: claim
    topic: human.information_processing
    statement: Human information processing is a staged, attention-bottlenecked pipeline shaped by top-down feedback.
    epistemic_status: established
    ratification: approved
    source: {type: conversation}
    evidence:
      - date: "2026-08-13"
        type: literature
        note: 'Canonical cognitive-science literature supports each pipeline stage and both caveats. Citations drawn from model knowledge of the canonical works; verification path before any promotion: fetch and check each source.'
        refs: ["Sperling (1960), Psychological Monographs — iconic (visual sensory) memory, sub-second persistence", "Darwin, Turvey & Crowder (1972) — echoic memory, a few seconds", "Broadbent (1958), Perception and Communication — filter theory of selective attention (the bottleneck)", "Atkinson & Shiffrin (1968) — multi-store model: sensory, short-term, long-term", "Miller (1956), Psych Review — span of ~7±2 chunks", "Cowan (2001), BBS — working-memory capacity nearer ~4 chunks", "Baddeley & Hitch (1974) — working memory as active manipulation", "McGaugh (2000), Science — memory consolidation", "Clark (2013), BBS — predictive processing: top-down expectation shapes perception (caveat 2)"]
      - date: "2026-08-13"
        type: verification
        note: 'Web verification of load-bearing citations (sampled: Sperling duration ~250ms confirmed; Cowan ~4 chunks vs Miller 7±2 confirmed; remainder canonical). External sources — independent of both the founding conversation and the backfill session''s model knowledge.'
        refs: ["https://www.ebsco.com/research-starters/psychology/sensory-memory", "https://philpapers.org/rec/COWTMN", "https://www.cambridge.org/core/services/aop-cambridge-core/content/view/44023F1147D4A1D44BDC0AD226838496/S0140525X01003922a.pdf/the-magical-number-4-in-short-term-memory-a-reconsideration-of-mental-storage-capacity.pdf"]
    sequence:
      - Sensory input — stimuli are converted into neural signals by the sense organs.
      - Sensory memory — raw input held very briefly (<1s visual, a few seconds auditory).
      - Attention & selection — most input is discarded; the main filter/bottleneck.
      - Perception & encoding — input is interpreted against existing knowledge and patterns.
      - Working memory — active manipulation, ~4-7 chunks, seconds to a minute; conscious thinking.
      - Long-term storage — consolidation via rehearsal, elaboration, association; effectively unlimited.
      - Retrieval & response — stored knowledge recalled to decide/act, generating feedback that restarts the cycle.
    caveats:
      - Stages are described sequentially but the brain runs many in parallel.
      - Top-down feedback — expectations from long-term memory constantly shape earlier stages such as perception.
