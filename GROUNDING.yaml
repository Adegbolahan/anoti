open_questions:
  - id: Q001
    date: 2026-08-12
    question: >
      Does familiar syntax carrying agent-oriented content design (the v3 record model, or an equivalent Markdown form) beat both the v1-era YAML and the sigil notation on comprehension accuracy AND token cost? Requires the controlled comparison in D004.verification.

    raised_by: session
    context: format-comprehension experiment (D004)
    status: open
    refs:
      - docs/specs/2026-08-12-anoti-plugin-design.md
  - id: Q002
    date: 2026-08-13
    question: >
      Should the spec's advisory-phase list (Vision, Discovery, Delivery, Business) be amended to include Design, or reworded class-based? architect and ui-designer are Design-phase advisory profiles that contradict the current text. Spec amendment is human-owned.

    raised_by: reviewer-spawn
    context: v1.1 role set review, Issue 3
    status: open
    refs:
      - docs/specs/2026-08-12-anoti-plugin-design.md
      - roles/ui-designer.md
  - id: Q003
    date: 2026-08-13
    question: >
      Are per-role tools allowlists and effort defaults (spec profile contract) deferred deliberately or dropped? No profile in the 23-role library carries them, so the spec's "tools list matches the role class" validation criterion is unverifiable. Affects all 23 profiles.

    raised_by: reviewer-spawn
    context: v1.1 role set review, Issue 2
    status: open
    refs:
      - docs/specs/2026-08-12-anoti-plugin-design.md
      - roles/
  - id: Q004
    date: 2026-08-13
    question: >
      Is haiku sufficient for the support role, whose duties include reproducing failures and translating them into requirements — investigation more than copywriting? A trial dispatch would settle it.

    raised_by: reviewer-spawn
    context: v1.1 role set review, questions item 3
    status: answered
    resolution: >
      2026-08-13, /anoti:review — answered yes by the D010 trial: haiku handled reproduce-and-translate at trial quality (caveats recorded on D010). Reopen on a contradicting trial, e.g. a non-crash failure class.

    refs:
      - roles/support.md
      - "D010 — trial evidence (positive, with caveats)"
