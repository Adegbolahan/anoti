  - id: D002
    date: 2026-08-12
    type: claim
    topic: ai.information_processing
    statement: LLMs process information as a parallel token-prediction loop; weights are frozen at training time and the context window acts as working memory.
    epistemic_status: established
    ratification: approved
    source: {type: conversation}
    evidence:
      - date: "2026-08-13"
        type: literature
        note: Transformer-architecture literature supports each stage of the described loop and both caveats. Citations from model knowledge of canonical works; verify sources before any promotion.
        refs: ["Vaswani et al. (2017), Attention Is All You Need — all-to-all self-attention computed in parallel; stacked layers; softmax distribution over vocabulary", "Radford et al. (2019), GPT-2 — autoregressive next-token generation loop", "Brown et al. (2020), GPT-3 — in-context learning with frozen weights; no updates at inference (caveats 1-2)"]
      - date: "2026-08-13"
        type: verification
        note: 'Web verification: Vaswani et al. 2017 attention-only parallelizable architecture confirmed; Brown et al. 2020 ''without any gradient updates or fine-tuning'' confirmed verbatim (frozen-weights caveat).'
        refs: ["https://papers.neurips.cc/paper/7181-attention-is-all-you-need.pdf", "https://arxiv.org/abs/2005.14165"]
    sequence:
      - Input — raw data arrives (text, image, audio) as the prompt.
      - Tokenization — input broken into tokens (word pieces, image patches).
      - Embedding — each token becomes a vector capturing meaning; similar meanings sit numerically close.
      - Attention — the model weighs which parts of the input matter for each token, all-to-all and in parallel.
      - Layered processing — stacked layers refine representations from surface features to abstract meaning.
      - Prediction — final layer yields a probability distribution over next tokens; one is selected.
      - Generation loop — the chosen token is appended and the process repeats until a stop condition.
    caveats:
      - Weights are frozen at training time; no learning occurs during inference.
      - The context window acts like working memory and is cleared between sessions.
    events:
      - {date: 2026-08-12, action: created, by: session}
      - {date: 2026-08-13, action: migrated, by: session, note: v2 -> v3}
      - {date: 2026-08-13, action: demoted, by: session, note: grandfathered; established without evidence list; evidence pending}
      - date: "2026-08-13"
        action: evidence-appended
        by: session
        note: literature backfill per Phase 2 carry-over; method independent of founding conversation
      - date: "2026-08-13"
        action: promoted
        by: human
        note: probable -> established in /anoti:review — verify-then-promote ruling; literature evidence (different method) plus external-source verification incl. verbatim frozen-weights confirmation
  - id: D003
    date: 2026-08-12
    type: claim
    topic: comparison.human_vs_ai
    statement: Human and AI processing pipelines rhyme in outline but diverge fundamentally on attention, working memory, long-term memory, and learning from interaction.
    epistemic_status: probable
    ratification: approved
    source: {type: conversation}
    evidence:
      - date: "2026-08-13"
        type: literature
        note: 'Synthesis claim: its contrasts inherit support from D001/D002 literature (dependence stated — this evidence is NOT independent of those records). Direct support for the learning-from-use contrast: in-context learning leaves weights unchanged while human memory consolidates continuously.'
        refs: ["Brown et al. (2020) — ICL without weight updates, vs continuous human consolidation (McGaugh 2000)", "Cowan (2001) ~4-chunk span vs fixed context windows — the working-memory contrast"]
    relationships:
      - {type: compares, target: D001}
      - {type: compares, target: D002}
    contrasts:
      - dimension: attention
        human: Serial bottleneck — most input discarded before deeper processing.
        ai: Parallel — attends over the entire input at once.
      - dimension: working_memory
        human: ~4-7 chunks, seconds to a minute.
        ai: Context window — large but fixed, cleared between sessions.
      - dimension: long_term_memory
        human: Continuously consolidated from experience.
        ai: Frozen in weights; updated only by retraining.
      - dimension: learning_from_interaction
        human: Constant — every exchange can reshape memory and expectations.
        ai: None by default — no weight changes during use.
    events:
      - {date: 2026-08-12, action: created, by: session}
      - {date: 2026-08-13, action: migrated, by: session, note: v2 -> v3}
      - {date: 2026-08-13, action: demoted, by: session, note: grandfathered; established without evidence list; evidence pending}
