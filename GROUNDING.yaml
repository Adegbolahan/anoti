# anoti memory store — schema v3. Records are immutable; all change is an
# appended events: entry. The index is GENERATED by scripts/regen-index.
meta:
  schema_version: 3
  scope: project
  policy: {entries_immutable: true, events_append_only: true, reverify_after_days: 180}
  changelog:
    - date: 2026-08-12
      note: Created as schema v1; migrated to v2 same day (index, provenance, typed relationships, verification rules).
    - date: 2026-08-13
      note: spec/plan file paths updated for the docs/ layout move (refs only; statements untouched).
    - date: 2026-08-13
      note: >
        Migrated v2 -> v3 (typed records, epistemic/ratification split, event log, generated index). Grandfathering applied: D001-D003 were established with no evidence list and demote to probable per the spec's own protocol. All v2 detail fields preserved verbatim on each record.

index:
  - ref: D001
    type: claim
    topic: human.information_processing
    statement: Human information processing is a staged, attention-bottlenecked pipeline shaped by top-down feedback.
  - ref: D002
    type: claim
    topic: ai.information_processing
    statement: LLMs process information as a parallel token-prediction loop; weights are frozen at training time and the context window acts as working memory.
  - ref: D003
    type: claim
    topic: comparison.human_vs_ai
    statement: Human and AI processing pipelines rhyme in outline but diverge fundamentally on attention, working memory, long-term memory, and learning from interaction.
  - ref: D004
    type: claim
    topic: ai.format_comprehension
    statement: Familiar structured formats are understood more reliably by AI agents than invented symbolic notation, because comprehension rides on training priors.
  - ref: D005
    type: claim
    topic: anoti.retrieval_path
    statement: The anoti retrieval path functions live in an installed session — index-based recall, demotion-aware status reporting, untrusted-data framing, and open-question surfacing behaved per spec.
  - ref: D006
    type: decision
    topic: anoti.role_models
    statement: >
      v1.1 role model assignments follow core-10 analogy: inherit for open-ended strategic judgment (visionary, legal), sonnet for execution and structured analysis (mobile, ai-ml, devops, performance, product-manager, requirements-analyst, ux-researcher, ui-designer), haiku for ratification-gated writing roles (sales, marketing, support).

  - ref: D007
    type: decision
    topic: anoti.role_classes
    statement: >
      The performance role is builder-class, not reviewer-class: the spec's own approach text ends "then optimize" (which entails editing code), the never-edits rule binds the reviewer role specifically, and the adversarial-handoff policy keeps its edits judged by a separate reviewer spawn.

  - ref: D008
    type: claim
    topic: anoti.slow_path
    statement: The anoti slow path functions live in an installed session — the classifier routes ambiguous asks to attend, a spec-complete attention frame is produced and persisted, and subsequent work follows the frame's evidence plan (test-first, live-verified).
  - ref: D009
    type: claim
    topic: anoti.full_cycle
    statement: The complete anoti cycle functions live end-to-end in an installed session — slow-path classification, attention framing, deliberation with adversarial handoff, inhibition denials enforced against the agent, Stop-gate consolidation, and selective human ratification.
  - ref: D010
    type: claim
    topic: anoti.support_haiku_trial
    statement: >
      A haiku support-role dispatch handles the reproduce-and-translate duty at trial quality: it reproduced two Important failures from user-style tickets with cited command/output/exit-code evidence, its root-cause call chains matched an independent reviewer's findings, and it rewrote both as requirements with testable acceptance criteria.

  - ref: D011
    type: decision
    topic: anoti.fix_round_continuation
    statement: >
      Fix rounds continue the original builder agent (message-resume) rather than spawning a fresh builder: the builder's own context yields a more coherent fix, and the continuation costs zero spawn budget.

  - ref: D012
    type: decision
    topic: anoti.workspace_layout
    statement: Memory stores live at project root (GROUNDING.yaml, TODOS.md, LESSONS-LEARNT.md) where hooks machine-read them each session; direction and deliberation documents live under docs/ (docs/ROADMAP.md, docs/HIGH-LEVEL-STORIES.md, docs/specs/, docs/plans/, docs/trials/).
  - ref: "D013"
    type: "decision"
    topic: "anoti.role_tools_deferral"
    statement: "Per-role tools allowlists and effort defaults are deliberately deferred: the practitioner inherits session tools, boundary enforcement lives in the inhibition decision table and native permissions, and per-role allowlists wait for evidence of need."
  - ref: "D014"
    type: "claim"
    topic: "anoti.pilot_sequence1"
    statement: "In benchmark pilot sequence 1, anoti showed no measurable advantage over vanilla Claude Code or instructions-only on the trap metrics: both traps ceilinged (all three arms caught the contradiction and used the revised retention value), the recall metric was unmeasurable (interactive points never executed), and arm B ran degraded (human-absent, no store ever bootstrapped)."
  - ref: "D015"
    type: "claim"
    topic: "anoti.classifier_headless"
    statement: "The UserPromptSubmit classifier under-triggered in headless mode before 0.3.1: zero slow verdicts across nine arm-B sessions including a nontrivial policy-trap prompt, while the model still caught the trap in-context."
  - ref: "D016"
    type: "decision"
    topic: "anoti.state_dir"
    statement: "The project state directory is configurable per project: resolution order ANOTI_DIR env var, then .claude/anoti.local.md frontmatter state_dir, then default .anoti — always project-relative; the global memory tier at ~/.claude/anoti resolves separately and the two are never conflated."
  - ref: "D017"
    type: "decision"
    topic: "anoti.repo_takeover"
    statement: "anoti replaced the getting-started-claude repository on the same remote, renamed to github.com/Adegbolahan/anoti: project-scaffolder deprecated with its four workflow commands adopted anoti-native (/new, /implement, /review-work, /update), its CI/CHANGELOG/marketplace discipline absorbed, old v3.x tags preserved for pinned installs, and the replacement executed as a no-force branch swap."
  - ref: "D018"
    type: "decision"
    topic: "anoti.sequence2_ruling"
    statement: "Benchmark sequence 2 is not run: sequence 1 verdicts stand as the standing synthetic result (D014), and the continuing test becomes a pre-registered longitudinal observational protocol over this repository real work — weekly trail audits counting contradiction incidents, bad-memory events, and recall successes."
  - ref: "D019"
    type: "decision"
    topic: "anoti.recall_metric_ruling"
    statement: "Recall successes in the longitudinal audit count textual record-ID citations only. An artifact that implements a record without naming it is a citation-discipline gap to fix in the artifact (policy-epistemic: artifacts cite what they implement, by ID), never a recall success to award."
  - ref: "D020"
    type: "policy"
    topic: "anoti.branch_protection"
    statement: "No edit actions on the default branch: implementation lands on a feature branch or a worktree. The inhibition hook enforces this mechanically — Edit/Write/NotebookEdit on tracked files is denied while HEAD is on main/master (or origin/HEAD); gitignored paths and episode-gated memory-organ writes pass; the human override is touch <state-dir>/allow-default-branch."
  - ref: "D021"
    type: "policy"
    topic: "anoti.candidate_consumption"
    statement: "Session-state candidates are consumed by mark-applied, never deletion: scripts/session-consume sets applied: true + applied_date, and consolidation collects only unapplied entries. No flow may instruct a raw session-YAML edit; every state write the skills mandate has a helper."
