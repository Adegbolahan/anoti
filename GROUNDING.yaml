  - {"id": "D013", "date": "2026-08-13", "type": "decision", "topic": "anoti.role_tools_deferral", "statement": "Per-role tools allowlists and effort defaults are deliberately deferred: the practitioner inherits session tools, boundary enforcement lives in the inhibition decision table and native permissions, and per-role allowlists wait for evidence of need.", "ratification": "approved", "source": {"type": "conversation", "context": "Q003 ruling, review follow-up"}, "rationale": "YAGNI: 23 unverifiable frontmatter fields add contract surface without a demonstrated failure; revisit if a role-boundary violation is observed live.", "events": [{"date": "2026-08-13", "action": "created", "by": "session"}, {"date": "2026-08-13", "action": "ratified", "by": "human", "note": "defer with recorded decision"}]}
  - {"id": "D014", "date": "2026-08-13", "type": "claim", "topic": "anoti.pilot_sequence1", "statement": "In benchmark pilot sequence 1, anoti showed no measurable advantage over vanilla Claude Code or instructions-only on the trap metrics: both traps ceilinged (all three arms caught the contradiction and used the revised retention value), the recall metric was unmeasurable (interactive points never executed), and arm B ran degraded (human-absent, no store ever bootstrapped).", "epistemic_status": "probable", "ratification": "approved", "source": {"type": "experiment", "context": "pre-registered H1-H3 pilot, sequence 1"}, "evidence": [{"date": "2026-08-13", "type": "experiment", "note": "Blinded per-arm grading against the planted answer key; decision rules applied as frozen: H1 against-with-ambiguity, H2 against-with-ambiguity, H3 untestable. Ceiling effect and degraded arm B stated as the ambiguity.", "refs": ["docs/trials/2026-08-13-h1h3-armA/GRADES.md", "docs/trials/2026-08-13-h1h3-armB/GRADES.md", "docs/trials/2026-08-13-h1h3-armC/GRADES.md", "docs/trials/2026-08-13-h1h3-INTERACTIVE-GAP-NOTE.md", "docs/specs/2026-08-13-exp-h1-h3-benchmark.md"]}], "events": [{"date": "2026-08-13", "action": "created", "by": "session"}, {"date": "2026-08-13", "action": "ratified", "by": "human", "note": "fix directive (we should fix the issues identified) treats findings as real; recorded accordingly"}]}
  - {"id": "D015", "date": "2026-08-13", "type": "claim", "topic": "anoti.classifier_headless", "statement": "The UserPromptSubmit classifier under-triggered in headless mode before 0.3.1: zero slow verdicts across nine arm-B sessions including a nontrivial policy-trap prompt, while the model still caught the trap in-context.", "epistemic_status": "probable", "ratification": "approved", "source": {"type": "experiment", "context": "arm B telemetry, pilot sequence 1"}, "evidence": [{"date": "2026-08-13", "type": "observation", "note": "Telemetry confusion counts: nontrivial recall 0/5, trivial specificity 2/2; the S4 trap rationale read the prompt as routine. Fix shipped in 0.3.1 (concrete slow criteria; headless applies identically) - claim covers pre-0.3.1 behavior; post-fix behavior needs its own measurement.", "refs": ["docs/trials/2026-08-13-h1h3-armB/telemetry.log", "docs/trials/2026-08-13-h1h3-armB/GRADES.md"]}], "events": [{"date": "2026-08-13", "action": "created", "by": "session"}, {"date": "2026-08-13", "action": "ratified", "by": "human", "note": "fix directive; defect fixed in 66e0a98"}]}
  - {"id": "D016", "date": "2026-08-13", "type": "decision", "topic": "anoti.state_dir", "statement": "The project state directory is configurable per project: resolution order ANOTI_DIR env var, then .claude/anoti.local.md frontmatter state_dir, then default .anoti — always project-relative; the global memory tier at ~/.claude/anoti resolves separately and the two are never conflated.", "ratification": "approved", "source": {"type": "conversation", "context": "user request relayed from live session; implemented same day"}, "rationale": "Single resolution point (scripts/anoti-dir) instead of eight hardcodes; gitignore follows the resolved dir; tier-collision concern answered by forbidding home-relative resolution.", "events": [{"date": "2026-08-13", "action": "created", "by": "session"}, {"date": "2026-08-13", "action": "ratified", "by": "human", "note": "requested the capability; default unchanged"}]}
  - {"id": "D017", "date": "2026-08-13", "type": "decision", "topic": "anoti.repo_takeover", "statement": "anoti replaced the getting-started-claude repository on the same remote, renamed to github.com/Adegbolahan/anoti: project-scaffolder deprecated with its four workflow commands adopted anoti-native (/new, /implement, /review-work, /update), its CI/CHANGELOG/marketplace discipline absorbed, old v3.x tags preserved for pinned installs, and the replacement executed as a no-force branch swap.", "ratification": "approved", "source": {"type": "conversation", "context": "human directive: option C, deprecate, take the four commands if they integrate"}, "rationale": "Marketplace continuity on a known URL (GitHub redirects the old name); scaffolder users keep working tags; anoti gains battle-tested release infrastructure; no force-push needed, honoring the deny-list.", "events": [{"date": "2026-08-13", "action": "created", "by": "session"}, {"date": "2026-08-13", "action": "ratified", "by": "human", "note": "option C chosen; rename to anoti requested"}]}
  - {"id": "D018", "date": "2026-08-13", "type": "decision", "topic": "anoti.sequence2_ruling", "statement": "Benchmark sequence 2 is not run: sequence 1 verdicts stand as the standing synthetic result (D014), and the continuing test becomes a pre-registered longitudinal observational protocol over this repository real work — weekly trail audits counting contradiction incidents, bad-memory events, and recall successes.", "ratification": "approved", "source": {"type": "conversation", "context": "human ruling after decision-support presentation"}, "rationale": "Three experiments ceilinged identically: synthetic traps below strong-model native competence measure the model, not the methodology. Rebuilding above the ceiling is an arms race; real long-horizon work is above it by construction. Observational honesty over synthetic theater.", "events": [{"date": "2026-08-13", "action": "created", "by": "session"}, {"date": "2026-08-13", "action": "ratified", "by": "human", "note": "accept + longitudinal protocol"}]}
  - {"id": "D019", "date": "2026-08-13", "type": "decision", "topic": "anoti.recall_metric_ruling", "statement": "Recall successes in the longitudinal audit count textual record-ID citations only. An artifact that implements a record without naming it is a citation-discipline gap to fix in the artifact (policy-epistemic: artifacts cite what they implement, by ID), never a recall success to award.", "ratification": "approved", "source": {"type": "conversation", "context": "human ruling on GitHub issue #4: option (a), citation-discipline"}, "rationale": "Counting silent implementations would reward invisible coupling and make the metric a judgment call; making in-text citation the norm keeps the count mechanical and the trail auditable. The incentive is now chosen, not accidental.", "events": [{"date": "2026-08-13", "action": "created", "by": "session"}, {"date": "2026-08-13", "action": "ratified", "by": "human", "note": "fix them, for 4. a"}]}
  - {"id": "D020", "date": "2026-08-13", "type": "policy", "topic": "anoti.branch_protection", "statement": "No edit actions on the default branch: implementation lands on a feature branch or a worktree. The inhibition hook enforces this mechanically — Edit/Write/NotebookEdit on tracked files is denied while HEAD is on main/master (or origin/HEAD); gitignored paths and episode-gated memory-organ writes pass; the human override is touch <state-dir>/allow-default-branch.", "ratification": "approved", "source": {"type": "conversation", "context": "human directive mid-session 2026-08-13: 'we need to make sure that not edit action on main branch or default branch — either a worktree or feature branch'"}, "rationale": "The git skill already stated the norm; norms without mechanism decay under pressure. The hook makes the safe path the only unattended path while keeping consolidation (episode-gated) and state-dir writes unaffected, and the override keeps the human in charge.", "events": [{"date": "2026-08-13", "action": "created", "by": "session"}, {"date": "2026-08-13", "action": "ratified", "by": "human", "note": "instruction-is-ratification: direct user directive"}]}
  - {"id": "D021", "date": "2026-08-13", "type": "policy", "topic": "anoti.candidate_consumption", "statement": "Session-state candidates are consumed by mark-applied, never deletion: scripts/session-consume sets applied: true + applied_date, and consolidation collects only unapplied entries. No flow may instruct a raw session-YAML edit; every state write the skills mandate has a helper.", "ratification": "approved", "source": {"type": "conversation", "context": "issue #9 field report (livingsyncs, real candidate loss from interleaved raw clearing writes); human approved the batch proposal naming the mark-applied direction"}, "rationale": "Deletion destroys the audit trail and invites the exact clobbering that lost a candidate in the field; marking keeps history inspectable and makes consumption idempotent. The 0.5.2 rule — mandated writes get helpers — now covers the consume side too.", "events": [{"date": "2026-08-13", "action": "created", "by": "session"}, {"date": "2026-08-13", "action": "ratified", "by": "human", "note": "proceed on the batch proposal"}]}
