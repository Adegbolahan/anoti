  - id: D004
    date: 2026-08-12
    type: claim
    topic: ai.format_comprehension
    statement: Familiar structured formats are understood more reliably by AI agents than invented symbolic notation, because comprehension rides on training priors.
    epistemic_status: probable
    ratification: approved
    source:
      type: comparative_agent_observation
      participants:
        - Claude (authored both formats, conceded the verdict)
        - Codex (read both formats cold, chose YAML as "easier to understand accurately")
    evidence:
      - date: 2026-08-12
        type: observation
        note: >
          Codex, reading a YAML grounding file and an equivalent bespoke sigil-notation file cold, judged YAML "easier to understand accurately" and the sigil file "error-prone, requires interpretation"; two agent judgments, not a controlled evaluation.

        refs:
          - docs/specs/2026-08-12-anoti-plugin-design.md
      - date: "2026-08-13"
        type: experiment
        note: 'Q001 pilot: four information-identical encodings, blinded haiku readers, 10 exact-answer questions each. All formats 10/10 including sigil — no accuracy separation at 8-fact scale (tension with founding observation noted; mechanism plausibly scale-dependent). Cost separated: MD 745B < sigil 986B < v1 1249B < v3 2388B; v3''s overhead is governance payload, not syntax.'
        refs: ["docs/trials/2026-08-13-q001-formats/RESULTS.md", "docs/specs/2026-08-13-exp-q001-formats.md"]
    relationships:
      - {type: refines, target: D002}
      - {type: compares, target: D001, note: AI priors modulate parsing the way human top-down expectations modulate perception}
    details:
      - Standard formats benefit from extensive representation in training data; a bespoke grammar has effectively one example in existence.
      - Custom notation introduces an additional in-context interpretation step, which costs attention and invites misreads.
      - Visual compactness does not necessarily imply lower tokenizer cost — rare Unicode sigils often encode as multiple tokens each.
      - What survives from the bespoke-format experiment is its information architecture (scan index, claim-first entries, provenance, freshness rules, append-only convention), not its syntax.
    caveats:
      - Based on two agent judgments, not a controlled evaluation.
      - Token-efficiency comparisons depend on the specific tokenizer used.
    verification:
      method: >
        Controlled comparison across formats (v2 YAML, v3 YAML, agent-oriented Markdown, sigil notation): same facts, measure comprehension accuracy via question-answering plus actual token counts per tokenizer.

      reverify_after_days: 180
    events:
      - {date: 2026-08-12, action: created, by: session}
      - {date: 2026-08-13, action: migrated, by: session, note: v2 -> v3; evidence entry formalized from v2 source/details}
      - date: "2026-08-13"
        action: evidence-appended
        by: session
        note: 'Q001 pilot run; decision rule: YES via agent-Markdown; ceiling caveat recorded'
